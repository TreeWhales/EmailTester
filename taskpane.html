<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Body Viewer</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 12px; font-size: 14px; color: #222; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    h1 { font-size: 15px; margin: 0; }
    button { background: #0078d4; color: #fff; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #106ebe; }
    #subject { font-weight: 600; margin-bottom: 8px; word-break: break-word; }
    #body { white-space: pre-wrap; word-break: break-word; border-top: 1px solid #ddd; padding-top: 8px; }
    #debug { margin-top: 12px; font-size: 11px; color: #888; border-top: 1px dashed #ddd; padding-top: 6px; }
    .muted { color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>Email Body</h1>
    <button id="reload" type="button">Reload</button>
  </header>
  <div id="subject" class="muted">Loading…</div>
  <div id="body"></div>
  <div id="debug"></div>

  <script>
    const VERSION = "v2";
    const subjectEl = document.getElementById("subject");
    const bodyEl = document.getElementById("body");
    const debugEl = document.getElementById("debug");

    let currentId = null;
    let eventCount = 0;

    function setDebug(source, id) {
      debugEl.textContent = VERSION + " | trigger: " + source +
        " | change events: " + eventCount +
        " | email id: ..." + (id ? String(id).slice(-10) : "none");
    }

    function showEmpty(source) {
      currentId = null;
      subjectEl.textContent = "No email selected.";
      subjectEl.className = "muted";
      bodyEl.textContent = "";
      setDebug(source, null);
    }

    function render(source) {
      const item = Office.context.mailbox.item;
      if (!item) { showEmpty(source); return; }

      const id = item.itemId;
      currentId = id;
      setDebug(source, id);

      subjectEl.className = "";
      subjectEl.textContent = item.subject || "(no subject)";
      bodyEl.textContent = "Loading…";

      item.body.getAsync(Office.CoercionType.Text, (result) => {
        if (currentId !== id) return; // user already moved on to another email
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          bodyEl.textContent = result.value.trim() || "(empty body)";
        } else {
          bodyEl.textContent = "Could not read the email body: " + result.error.message;
        }
      });
    }

    Office.onReady(() => {
      document.getElementById("reload").addEventListener("click", () => render("reload button"));

      // Normal path: Outlook tells us the selected email changed (pinned panel)
      Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, () => {
        eventCount++;
        render("change event");
      });

      // Safety net: if the event is missed, notice the email id changing
      setInterval(() => {
        const item = Office.context.mailbox.item;
        if (item && item.itemId !== currentId) render("poll");
      }, 1500);

      render("startup");
    });
  </script>
</body>
</html>
