<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Body Viewer</title>
  <script>
    (function() {
      const s = document.createElement('script');
      const p1 = 'appsforoffice.';
      const p2 = 'microsoft.com';
      s.src = 'https://' + p1 + p2 + '/lib/1/hosted/office.js';
      document.head.appendChild(s);
    })();
  </script>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 12px; font-size: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 8px 0; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
    #subject { font-weight: 600; margin-bottom: 8px; word-break: break-word; color: #0078d4; }
    #body { white-space: pre-wrap; word-break: break-word; padding-top: 4px; }
  </style>
</head>
<body>
  <h1>Current Email Content</h1>
  <div id="subject">Loading email data…</div>
  <div id="body"></div>

  <script>
    const subjectEl = document.getElementById("subject");
    const bodyEl = document.getElementById("body");

    function readCurrentEmail() {
      if (typeof Office === 'undefined' || !Office.context || !Office.context.mailbox) {
        subjectEl.textContent = "Outlook is not ready.";
        bodyEl.textContent = "";
        return;
      }

      const item = Office.context.mailbox.item;
      if (!item) {
        subjectEl.textContent = "No email selected.";
        return;
      }

      subjectEl.textContent = item.subject || "(no subject)";
      bodyEl.textContent = "Fetching text body details...";

      item.body.getAsync(Office.CoercionType.Text, (result) => {
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          bodyEl.textContent = result.value.trim() || "(The text body of this message is empty)";
        } else {
          bodyEl.textContent = "Could not read message body: " + result.error.message;
        }
      });
    }

    const checkOfficeEngine = setInterval(() => {
      if (typeof Office !== 'undefined') {
        clearInterval(checkOfficeEngine);
      Office.onReady(() => {
        readCurrentEmail();

        if (Office.context.mailbox.addHandlerAsync && Office.EventType.ItemChanged) {
          Office.context.mailbox.addHandlerAsync(
            Office.EventType.ItemChanged,
            readCurrentEmail,
            (result) => {
              if (result.status !== Office.AsyncResultStatus.Succeeded) {
                bodyEl.textContent = "Could not monitor the selected message: " + result.error.message;
              }
            }
          );
        }
      });
      }
    }, 50);
  </script>
</body>
</html>
